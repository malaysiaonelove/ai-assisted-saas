services:
  db:
    image: postgres:16-alpine
    container_name: salesbook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: salesbook
      POSTGRES_PASSWORD: salesbook
      POSTGRES_DB: salesbook
    ports:
      - "5432:5432"
    volumes:
      - salesbook_pgdata:/var/lib/postgresql/data

volumes:
  salesbook_pgdata:
